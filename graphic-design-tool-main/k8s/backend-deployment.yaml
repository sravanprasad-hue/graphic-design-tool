apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphic-design-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graphic-design-backend
  template:
    metadata:
      labels:
        app: graphic-design-backend
    spec:
      containers:
      - name: backend
        image: 428708298136.dkr.ecr.ap-south-1.amazonaws.com/graphic-design-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5050
        envFrom:
        - secretRef:
            name: backend-secret
